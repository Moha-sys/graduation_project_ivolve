---
# AWS EC2 Dynamic Inventory Plugin Configuration
# Can query EC2 instances filtered by tags
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1

# Filter instances created for this project
filters:
  tag:Project: ivolve
  instance-state-name: running

# Key and group grouping
keyed_groups:
  - key: tags.Role
    prefix: tag_Role
  - key: tags.Project
    prefix: tag_Project

hostnames:
  - ip-address
  - dns-name
  - tag:Name

compose:
  ansible_host: public_ip_address
