---
- name: Update apt repository cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade installed system packages
  ansible.builtin.apt:
    upgrade: dist
  when: ansible_os_family == 'Debian'

- name: Install common utility packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - gnupg
      - lsb-release
      - apt-transport-https
      - ca-certificates
      - software-properties-common
      - unzip
      - jq
    state: present
